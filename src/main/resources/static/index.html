<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biodata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page" id="page">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <p class="ledger-no">No. 01</p>
      <h1 class="name" id="s-name" data-field="name">Your Name</h1>
      <p class="tagline" id="s-title" data-field="title">Software Engineer</p>
    </div>

    <div class="sidebar-contact">
      <div class="contact-row">
        <span class="contact-label">Email</span>
        <span class="contact-value" id="s-email" data-field="email">you@example.com</span>
      </div>
      <div class="contact-row">
        <span class="contact-label">Phone</span>
        <span class="contact-value" id="s-phone" data-field="phone">+1 234 567 8900</span>
      </div>
      <div class="contact-row">
        <span class="contact-label">Based in</span>
        <span class="contact-value" id="s-location" data-field="location">City, Country</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="#summary">Summary</a>
      <a href="#education">Education</a>
      <a href="#skills">Skills</a>
      <a href="#projects">Projects</a>
    </nav>

    <div class="sidebar-links" id="s-links">
      <a id="s-linkedin" href="#" target="_blank" rel="noopener">LinkedIn</a>
      <a id="s-github" href="#" target="_blank" rel="noopener">GitHub</a>
      <a id="s-website" href="#" target="_blank" rel="noopener">Website</a>
    </div>

  </aside>

  <!-- ===================== MAIN CONTENT ===================== -->
  <main class="content">

    <section id="summary" class="block">
      <h2 class="block-title">Summary</h2>
      <p class="summary-text" id="p-summary" data-field="summary">Loading&hellip;</p>
    </section>

    <section id="education" class="block">
      <h2 class="block-title">Education</h2>
      <div class="ledger" id="education-list"></div>
    </section>

    <section id="skills" class="block">
      <h2 class="block-title">Skills</h2>
      <div class="skills-grid" id="skills-list"></div>
    </section>

    <section id="projects" class="block">
      <h2 class="block-title">Projects</h2>
      <div class="ledger" id="projects-list"></div>
    </section>

    <footer class="page-footer">
      <span id="footer-name">Your Name</span> &mdash; built with Spring Boot
    </footer>

  </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
