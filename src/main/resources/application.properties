# Server
server.port=8080

# H2 file-based database - data persists in ./data/biodatadb.mv.db
spring.datasource.url=jdbc:h2:file:./data/biodatadb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 web console (optional, for inspecting the database directly)
# Visit http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/biodatadb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
